server:
  port: 9999

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive

  cloud:
    gateway:
      routes:
        - id: config-service
          uri: http://localhost:8999/
          predicates:
            - Path=/configService/**

        - id: apiManagement-service
          uri: http://localhost:8082/
          predicates:
            - Path=/apiManagement-service/**

        - id: userManagement-service
          uri: http://localhost:8081
          predicates:
            - Path=/userManagement-service/**

        - id: logs-service
          uri: http://localhost:8084
          predicates:
            - Path=/logs-service/**

  config:
    import: "optional:configserver:http://localhost:8888/"
